# Known gaps recorded rather than guessed.
unresolved:
  - id: ENV-CONTRACT-INCOMPLETE
    severity: high
    description: >-
      .env.example declares only NEXT_PUBLIC_CLARITY_PROJECT_ID,
      NEXT_PUBLIC_GA_MEASUREMENT_ID, PARTNERS_ACCESS_KEY and VISION_ACCESS_KEY.
      Supabase URL and keys are consumed throughout via @supabase/ssr but are
      entirely undocumented. No new environment can be provisioned from the template.
    owner: usa-102
  - id: ADMIN-BOUNDARY-UNRESOLVED
    severity: high
    description: >-
      app/admin mixes usam-public-web back-office with organization-platform.
      Per-file classification has not been performed; the 91/9 split is by
      subdirectory LOC, not line-by-line reading.
    owner: usa-103
  - id: ORGOS-TENANCY-CONTRADICTION
    severity: high
    description: >-
      organizations/organization_memberships/person_roles model multi-organization
      tenancy, but access control is a single global admin_users allowlist.
      Requires a founder decision before Organization OS V1.
    owner: usa-101
  - id: ALIGNED-INSIGHTS-TABLE
    severity: medium
    description: >-
      Remote migration create_aligned_insights_inquiries exists in the production
      database with no local migration file. Aligned Insights ownership is
      unconfirmed. Classified external-or-unknown.
    owner: usa-100
