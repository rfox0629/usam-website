# --------------------------------------------------------------------------
# Drift appendix — USA-100 evidence. READ-ONLY. No remediation proposed here.
# --------------------------------------------------------------------------
drift_appendix:
  issue: USA-100
  status: open
  remediation_authorized: false
  summary: >-
    Drift is version-level, not merely count-level. 125 local migration files
    versus 70 applied remote migrations, AND identically-named migrations carry
    different version timestamps. Because versions differ for the same logical
    migration, `supabase db push` cannot converge without history repair, and
    `supabase db pull` would generate a snapshot disagreeing with 125 local files.

  version_mismatches:
    - name: missionary_profiles_foundation
      local_version: '20260501164602'
      remote_version: '20260501185143'
    - name: create_admin_users_allowlist
      local_version: '20260501201146'
      remote_version: '20260501203837'
    - name: create_financial_freedom_inquiries
      local_version: '20260501202545'
      remote_version: '20260501203857'
    - name: optimize_admin_rls_policies
      local_version: '20260501203951'
      remote_version: '20260501204036'

  remote_only_migrations:
    - name: communications_resend_subscribers
      remote_version: '20260728035152'
      concern: applied out-of-band; no local file
    - name: create_aligned_insights_inquiries
      remote_version: '20260514190043'
      concern: cross-tenant table with unconfirmed ownership

  distinction:
    logical_ownership: >-
      Which application conceptually owns the data. Documented above.
    physical_database_location: >-
      One Supabase project (dbupuphezeqkiolprrlg) for everything. Unchanged.
    migration_history_ownership: >-
      Currently ambiguous — this IS the USA-100 defect. The remote
      supabase_migrations table and the local directory disagree on both
      membership and versioning.
    runtime_access: >-
      All domains via the same 87-LOC src/lib/supabase client. RLS is the only
      runtime enforcement boundary that exists today.

  gates:
    - USA-100 must be resolved before database-sensitive application movement.
    - >-
      USA-86 backup readiness must be verified — a tested pg_dump restore plus
      storage export — before any migration-history repair. Backup readiness is
      NOT assumed.

limitations:
  - Table ownership derived from migration DDL and grep-based consumer counts, not from live information_schema queries.
  - RLS policies, triggers, storage buckets and edge functions were NOT enumerated; that requires live queries beyond the read-only scope taken.
  - Consumer counts are file counts containing a table-name literal, which over-counts comments and under-counts dynamic query construction.
  - The 102-table figure counts CREATE TABLE statements; tables created then dropped across migrations may inflate it.
