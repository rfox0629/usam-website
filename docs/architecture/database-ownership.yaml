# Database Ownership Manifest — Supabase project usam-website (dbupuphezeqkiolprrlg)
#
# STATIC ANALYSIS ONLY. Derived from migration DDL and code references at
# commit b90dbc72183a plus a read-only list_migrations call. No database was
# mutated, no migration was run, no history was repaired.
#
# Logical ownership != physical location. Every table below lives in ONE Supabase
# project today and that is not proposed to change.

version: 1
generated: '2026-07-28'
evidence_commit: b90dbc72183a
supabase_project: usam-website
supabase_ref: dbupuphezeqkiolprrlg
supabase_status: ACTIVE_HEALTHY
local_migration_files: 125
remote_applied_migrations: 70
distinct_tables_in_ddl: 102

evidence_method: >-
  Tables extracted from `CREATE TABLE` statements across supabase/migrations/**.
  Consumers counted by grepping table-name literals within each domain's path
  patterns. RLS presence is only asserted where a migration filename or body
  makes it explicit; absence of a note is NOT evidence of absent RLS.

# --------------------------------------------------------------------------
# Position statement — deliberate, and not a consequence of workspace layout
# --------------------------------------------------------------------------
position:
  one_shared_project_remains_appropriate: true
  rationale: >-
    Application workspaces do not require database separation. Eight objects form
    a shared identity and organization core consumed by every domain; splitting
    them would fork auth.users and profiles and force cross-database identity sync
    on every login, household lookup, and prayer/support join.
  shared_identity_must_not_be_duplicated: true
  enforcement_order:
    - 1. ownership documentation (this file)
    - 2. naming conventions (the dos_* prefix already namespaces 48 tables)
    - 3. RLS policies as the real runtime boundary
    - 4. optional API boundary — only when a second engineer owns a domain independently
    - 5. physical database separation — a LATER decision, not an immediate requirement
  do_not: >-
    Do not recommend separate databases merely because applications become
    separate workspaces. These are independent decisions.

# --------------------------------------------------------------------------
# Shared core — the actual coupling
# --------------------------------------------------------------------------
shared_identity:
  - object: auth.users
    type: table
    managed_by: supabase-auth
    primary_logical_owner: shared-identity
    shared_consumers: [dos-app, organization-platform, usam-public-web, shared-platform]
    extraction_sensitivity: critical
    api_boundary_recommendation: never-split
    notes: Supabase-managed. Forking this is not viable.

  - object: profiles
    type: table
    primary_logical_owner: shared-identity
    current_consumers: {dos-app: 8, transitional-or-unclear: 4, usam-public-web: 1}
    shared_consumers: [dos-app, organization-platform, usam-public-web]
    extraction_sensitivity: critical
    api_boundary_recommendation: never-split
    rls_present: true

  - object: admin_users
    type: table
    primary_logical_owner: shared-identity
    current_consumers: {transitional-or-unclear: 3}
    extraction_sensitivity: high
    migration_file: 20260501201146_create_admin_users_allowlist.sql
    local_migration_version: '20260501201146'
    remote_version: '20260501203837'
    version_drift: true
    api_boundary_recommendation: keep-shared
