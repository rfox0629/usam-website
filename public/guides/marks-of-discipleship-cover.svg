<svg width="720" height="1080" viewBox="0 0 720 1080" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Discipleship guided resource cover</title>
  <desc id="desc">Text-forward placeholder cover for Discipleship by A.W. Tozer, used until licensed cover art is available.</desc>
  <rect width="720" height="1080" fill="#0F172A"/>
  <rect x="44" y="44" width="632" height="992" rx="28" fill="#F8FBFF"/>
  <rect x="78" y="78" width="564" height="924" rx="20" fill="#FFFFFF" stroke="#DCEBFF" stroke-width="4"/>
  <rect x="112" y="120" width="72" height="8" rx="4" fill="#F59E0B"/>
  <text x="112" y="185" fill="#2563EB" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="800" letter-spacing="4">GUIDED JOURNEY</text>
  <text x="112" y="420" fill="#0F172A" font-family="Inter Tight, Inter, Arial, sans-serif" font-size="92" font-weight="800">Disciple-</text>
  <text x="112" y="512" fill="#0F172A" font-family="Inter Tight, Inter, Arial, sans-serif" font-size="92" font-weight="800">ship</text>
