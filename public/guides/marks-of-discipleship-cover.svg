  <text x="112" y="828" fill="#64748B" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700">Session guide, reflections,</text>
  <text x="112" y="866" fill="#64748B" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700">leader notes, and next steps</text>
  <text x="112" y="944" fill="#94A3B8" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="800" letter-spacing="3">USA MISSIONARIES</text>
