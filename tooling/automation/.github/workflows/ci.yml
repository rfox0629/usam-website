name: CI

on:
  pull_request:
    branches:
      - main
      - preservation/initial-20260727
  push:
    branches:
      - main
      - preservation/initial-20260727

permissions:
  contents: read

jobs:
  test:
    name: Regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      CI: true

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test
